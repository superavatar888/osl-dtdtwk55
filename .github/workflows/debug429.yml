name: Debug 429
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 打印出口 IP 和网络环境
        run: |
          echo "=== 出口 IP ==="
          curl -s --max-time 10 https://api.ipify.org; echo
          echo "=== 其他 IP 服务 ==="
          curl -s --max-time 10 https://ifconfig.me; echo
      - name: OpenSea 429 测试（POST 空订单，60 次 @ 1s 间隔）
        run: |
          KEY="${{ secrets.API_KEY_1 }}"
          echo "key 前缀: ${KEY:0:8}"
          OK=0; T429=0; OTHER=0
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -X POST https://api.opensea.io/api/v2/orders/ethereum/seaport/listings \
              -H "x-api-key: $KEY" -H "Content-Type: application/json" -d '{}')
            if [ "$CODE" = "429" ]; then T429=$((T429+1)); elif [ "$CODE" = "400" ]; then OK=$((OK+1)); else OTHER=$((OTHER+1)); fi
            sleep 1
          done
          echo "结果: OK(400)=$OK 429=$T429 other=$OTHER"
          echo "=== 带重试头的 429 响应 ==="
          curl -s -D - -o /dev/null --max-time 15 \
            -X POST https://api.opensea.io/api/v2/orders/ethereum/seaport/listings \
            -H "x-api-key: $KEY" -H "Content-Type: application/json" -d '{}' | head -30
